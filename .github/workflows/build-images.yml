name: Build images

on:
  push:
    branches: [main, develop]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/musfiqdehan/wufud-backend:${{ github.sha }}
            ghcr.io/musfiqdehan/wufud-backend:${{ github.ref_name }}
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/musfiqdehan/wufud-frontend:${{ github.sha }}
            ghcr.io/musfiqdehan/wufud-frontend:${{ github.ref_name }}
