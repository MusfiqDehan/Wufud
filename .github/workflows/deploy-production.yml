name: Deploy production

on:
  workflow_run:
    workflows: ["Build images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false
        default: main
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.PROD_PATH }}
            git pull --ff-only
            echo "${{ secrets.PROD_ENV }}" > .env.production
            export IMAGE_TAG=${{ github.event.inputs.image_tag || (github.event.workflow_run && github.event.workflow_run.head_sha) || (github.ref_type == 'tag' && github.ref_name) || 'main' }}
            PREV=$(docker compose --env-file .env.production -f docker-compose.prod.yml ps -q backend || true)
            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend node dist/cli/migrate-public.js
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend node dist/cli/migrate-tenants.js
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend node dist/cli/seed-demo.js
            if ! curl -fsS https://wufud.musfiqdehan.com/api/v1/health; then
              echo "Health check failed"
              exit 1
            fi
