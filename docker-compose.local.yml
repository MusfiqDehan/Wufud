services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wufud
      POSTGRES_PASSWORD: wufud
      POSTGRES_DB: wufud
    ports:
      - "55432:5432"
    volumes:
      - wufud_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wufud"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # One-shot: avoid parallel pnpm install from backend + frontend on the same volume.
  install:
    image: node:22-bookworm
    working_dir: /app
    restart: "no"
    command: sh -c "corepack enable && pnpm install && pnpm --filter @wufud/contracts build"
    volumes:
      - .:/app
      - wufud_node_modules:/app/node_modules
    environment:
      CI: "true"

  backend:
    image: node:22-bookworm
    working_dir: /app
    command: >
      sh -c "corepack enable &&
      pnpm --filter backend migrate:public &&
      pnpm --filter backend migrate:tenants &&
      pnpm --filter backend seed:demo &&
      pnpm --filter backend dev"
    volumes:
      - .:/app
      - wufud_node_modules:/app/node_modules
    env_file:
      - path: .env.local
        required: false
    environment:
      CI: "true"
      DATABASE_URL: postgresql://wufud:wufud@postgres:5432/wufud
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      PLATFORM_HOST: wufud.localhost
      DEMO_PASSWORD: WufudDemo!2026
      SEED_DEMO: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      JWT_ACCESS_SECRET: local-access-secret-change-me
      JWT_REFRESH_SECRET: local-refresh-secret-change-me
    ports:
      - "4400:4000"
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "corepack enable && pnpm --filter frontend exec next dev --hostname 0.0.0.0 --port 3000"
    volumes:
      - .:/app
      - wufud_node_modules:/app/node_modules
    environment:
      CI: "true"
      API_INTERNAL_URL: http://backend:4000
      PLATFORM_HOST: wufud.localhost
    ports:
      - "3000:3000"
    depends_on:
      install:
        condition: service_completed_successfully
      backend:
        condition: service_started

volumes:
  wufud_pg:
  wufud_node_modules:
