services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wufud
      POSTGRES_PASSWORD: wufud
      POSTGRES_DB: wufud_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    tmpfs:
      - /data
