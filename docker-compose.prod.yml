services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    hostname: wufud-postgres
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - wufud_prod_pg:/var/lib/postgresql/data
    networks:
      internal:
        aliases: [wufud-postgres]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    hostname: wufud-redis
    mem_limit: 256m
    cpus: 0.5
    networks:
      internal:
        aliases: [wufud-redis]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/musfiqdehan/wufud-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    hostname: wufud-backend
    mem_limit: 768m
    cpus: 1.5
    env_file: .env.production
    environment:
      MIKRO_ORM_ALLOW_VERSION_MISMATCH: "true"
    depends_on: [postgres, redis]
    volumes:
      - /srv/shared/traefik/dynamic:/traefik/dynamic
    networks:
      internal:
        aliases: [wufud-backend]
      traefik_proxy:
        aliases: [wufud-backend]
    labels:
      - autoheal=false
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.wufud-api.rule=HostRegexp(`^([a-z0-9][a-z0-9-]*\.)?wufud\.musfiqdehan\.com$`) && PathPrefix(`/api`)
      - traefik.http.routers.wufud-api.priority=200
      - traefik.http.routers.wufud-api.entrypoints=websecure
      - traefik.http.routers.wufud-api.tls=true
      - traefik.http.routers.wufud-api.tls.certresolver=letsencrypt
      - traefik.http.routers.wufud-api.tls.domains[0].main=wufud.musfiqdehan.com
      - traefik.http.routers.wufud-api.tls.domains[0].sans=*.wufud.musfiqdehan.com
      - traefik.http.routers.wufud-api.middlewares=security-headers@file,compress@file,api-ratelimit@file
      - traefik.http.services.wufud-api.loadbalancer.server.port=4005
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ghcr.io/musfiqdehan/wufud-backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    command: ["node", "dist/worker.js"]
    env_file: .env.production
    environment:
      MIKRO_ORM_ALLOW_VERSION_MISMATCH: "true"
    depends_on: [postgres, redis]
    labels:
      - autoheal=false
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/musfiqdehan/wufud-frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    env_file: .env.production
    environment:
      API_INTERNAL_URL: http://wufud-backend:4005
      HOSTNAME: 0.0.0.0
    depends_on: [backend]
    networks: [internal, traefik_proxy]
    labels:
      - autoheal=false
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.wufud-web.rule=HostRegexp(`^([a-z0-9][a-z0-9-]*\.)?wufud\.musfiqdehan\.com$`) && !PathPrefix(`/api`)
      - traefik.http.routers.wufud-web.priority=200
      - traefik.http.routers.wufud-web.entrypoints=websecure
      - traefik.http.routers.wufud-web.tls=true
      - traefik.http.routers.wufud-web.tls.certresolver=letsencrypt
      - traefik.http.routers.wufud-web.tls.domains[0].main=wufud.musfiqdehan.com
      - traefik.http.routers.wufud-web.tls.domains[0].sans=*.wufud.musfiqdehan.com
      - traefik.http.routers.wufud-web.middlewares=security-headers@file,compress@file
      - traefik.http.services.wufud-web.loadbalancer.server.port=3009
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
  traefik_proxy:
    external: true

volumes:
  wufud_prod_pg:
